services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306" # Securely expose only to VPS localhost for tunneling
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - jhu-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80" # For local testing: http://localhost:3000
    depends_on:
      - backend
    networks:
      - jhu-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jhu-frontend.rule=Host(`jobhuntingu.com`) || Host(`www.jobhuntingu.com`)"
      - "traefik.http.routers.jhu-frontend.entrypoints=websecure"
      - "traefik.http.routers.jhu-frontend.tls=true"
      - "traefik.http.routers.jhu-frontend.tls.certresolver=letsencrypt"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001" # For local testing: http://localhost:3001
    depends_on:
      - db
    networks:
      - jhu-network
    expose:
      - "3001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jhu-backend.rule=(Host(`jobhuntingu.com`) || Host(`www.jobhuntingu.com`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.jhu-backend.entrypoints=websecure"
      - "traefik.http.routers.jhu-backend.tls=true"
      - "traefik.http.routers.jhu-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.jhu-backend.priority=100"
      - "traefik.http.services.jhu-backend.loadbalancer.server.port=3001"

  chatbot-backend:
    build:
      context: ./chatbot-backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000" # For local testing: http://localhost:8000
    networks:
      - jhu-network
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jhu-chatbot.rule=(Host(`jobhuntingu.com`) || Host(`www.jobhuntingu.com`)) && PathPrefix(`/api/chatbot`)"
      - "traefik.http.routers.jhu-chatbot.entrypoints=websecure"
      - "traefik.http.routers.jhu-chatbot.tls=true"
      - "traefik.http.routers.jhu-chatbot.tls.certresolver=letsencrypt"
      - "traefik.http.routers.jhu-chatbot.priority=200"
      - "traefik.http.routers.jhu-chatbot.middlewares=jhu-chatbot-stripprefix"
      - "traefik.http.middlewares.jhu-chatbot-stripprefix.stripprefix.prefixes=/api/chatbot"
      - "traefik.http.services.jhu-chatbot.loadbalancer.server.port=8000"

volumes:
  db_data:

networks:
  jhu-network:
    driver: bridge
